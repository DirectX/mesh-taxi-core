[workspace]
resolver = "2"
members = [
    "taxi-core",
    "taxi-passenger",
    "taxi-driver",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
h3o = "0.11.0"
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.0", features = ["alloc"] }
tokio = { version = "1.53", features = ["full"] }
uuid = { version = "1.28", features = ["v4"] }
veilid-core = "0.5.7"
sha2 = "0.11.1"
blake3 = "1.8"
ed25519-dalek = "3.0.0"
clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0"

[profile.release]
lto = true
